<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="rfcBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E38" />
      <stop offset="100%" stop-color="#030812" />
    </radialGradient>
    <linearGradient id="rfcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <filter id="rfcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#rfcBg)" stroke="#00F0FF" stroke-width="4" stroke-opacity="0.6" />

  <!-- Scroll / Document Symbol -->
  <g filter="url(#rfcGlow)" stroke="url(#rfcGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="150" y="120" width="212" height="272" rx="16" />
    <line x1="190" y1="180" x2="322" y2="180" />
    <line x1="190" y1="236" x2="322" y2="236" />
    <line x1="190" y1="292" x2="270" y2="292" />
  </g>
</svg>
